# Headless service (clusterIP: None): no load balancing, just DNS. It gives
# each pod a stable name like raftkv-0.raftkv, which Raft peers will need to
# find each other.
apiVersion: v1
kind: Service
metadata:
  name: raftkv
  labels:
    app: raftkv
spec:
  clusterIP: None
  selector:
    app: raftkv
  ports:
    - name: http
      port: 8080
---
# Client-facing service: one stable address that forwards to the pods.
apiVersion: v1
kind: Service
metadata:
  name: raftkv-client
  labels:
    app: raftkv
spec:
  selector:
    app: raftkv
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# StatefulSet, not Deployment: each pod keeps the same name and the same disk
# across restarts, which a node holding a WAL (and later a Raft log) needs.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raftkv
spec:
  serviceName: raftkv
  # Keep this at 1 until Raft exists. Each pod has its own independent WAL,
  # so with 3 replicas the client service would scatter writes across 3
  # stores that never agree.
  replicas: 1
  selector:
    matchLabels:
      app: raftkv
  template:
    metadata:
      labels:
        app: raftkv
    spec:
      securityContext:
        runAsNonRoot: true
        # Make the mounted volume writable by the image's nonroot user.
        fsGroup: 65532
      containers:
        - name: raftkv
          image: raftkv:dev
          # The image is loaded into the local cluster, not pulled from a registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
          # Readiness: send traffic only once the WAL has replayed and the
          # server is listening.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          # Liveness: restart the container if it stops answering.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  # One PersistentVolumeClaim per pod (data-raftkv-0, ...). It outlives the
  # pod, so a restarted raftkv-0 reattaches to the same WAL.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
